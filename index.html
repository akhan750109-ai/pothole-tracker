<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicFix - Smart Grievance Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #1a252f; color: #fff; padding: 1.2rem; text-align: center; }
        .container { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
        .card h2 { color: #2c3e50; margin-bottom: 1rem; font-size: 1.2rem; border-bottom: 2px solid #ecf0f1; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.7rem; border: 1px solid #ccc; border-radius: 4px; }
        .btn-gps { background-color: #27ae60; color: white; border: none; padding: 0.7rem; border-radius: 4px; cursor: pointer; margin-bottom: 0.5rem; width: 100%; font-weight: bold; font-size: 0.95rem; }
        .btn-otp { background-color: #2980b9; color: white; border: none; padding: 0.6rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 0.4rem; width: 100%; font-size: 0.95rem; }
        .btn-submit { background-color: #e74c3c; color: white; border: none; padding: 0.8rem; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; margin-top: 0.5rem; }
        #map { height: 220px; width: 100%; border-radius: 6px; margin-bottom: 1rem; border: 1px solid #ccc; }
        .report-item { background: #fafafa; border-left: 4px solid #e74c3c; padding: 1rem; margin-bottom: 1rem; border-radius: 0 4px 4px 0; }
        .report-img { max-width: 100%; height: 180px; object-fit: cover; border-radius: 4px; margin-top: 0.5rem; }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; font-size: 0.8rem; border-radius: 3px; color: white; background-color: #e67e22; margin-top: 0.5rem; }
        .badge-verified { background-color: #27ae60; }
        .tracking-id { font-weight: bold; color: #2980b9; }
        .otp-box { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
        .otp-box input { flex: 1; }
        .otp-box button { width: auto; margin-top: 0; background-color: #27ae60; }
        .status-msg { font-weight: bold; color: #27ae60; font-size: 0.85rem; margin-top: 0.3rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 CivicFix Smart Grievance Portal</h1>
        <p>फोटो, GPS लोकेशन, पिन कोड व OTP सत्यापन के साथ शिकायत दर्ज करें</p>
    </header>

    <div class="container">
        <!-- Complaint Form -->
        <div class="card">
            <h2>नई शिकायत दर्ज करें (Report Grievance)</h2>
            <form id="issueForm">
                
                <div class="form-group">
                    <label>समस्या का प्रकार (Issue Type)</label>
                    <select id="issueType" required>
                        <option value="Pothole">सड़क का गड्ढा (Pothole)</option>
                        <option value="Waterlogging">जलभराव (Waterlogging)</option>
                        <option value="Damaged Road">टूटी सड़क (Damaged Road)</option>
                    </select>
                </div>

                <!-- Feature 1: Mobile & Instant OTP -->
                <div class="form-group">
                    <label>मोबाइल नंबर (Mobile Number)</label>
                    <input type="tel" id="mobile" placeholder="10 अंकों का मोबाइल नंबर दर्ज करें" pattern="[0-9]{10}" required>
                    <button type="button" class="btn-otp" id="sendOtpBtn">OTP प्राप्त करें (Get OTP)</button>
                </div>

                <div class="form-group" id="otpSection" style="display:none;">
                    <label>OTP सत्यापित करें</label>
                    <div class="otp-box">
                        <input type="text" id="otpInput" placeholder="4-अंकों का OTP डालें" maxlength="4">
                        <button type="button" class="btn-otp" id="verifyOtpBtn">Verify OTP</button>
                    </div>
                    <div id="otpMessage" class="status-msg"></div>
                </div>

                <!-- Feature 2: Current GPS Location -->
                <div class="form-group">
                    <label>आपकी करंट लोकेशन (Current Location)</label>
                    <button type="button" class="btn-gps" id="getGpsBtn">📍 करंट GPS लोकेशन सेट करें</button>
                    <div id="map"></div>
                </div>

                <!-- Feature 3: Pincode -->
                <div class="form-group">
                    <label>पिन कोड (Pincode)</label>
                    <input type="text" id="pincode" placeholder="उदा: 247774" pattern="[0-9]{6}" maxlength="6" required>
                </div>

                <div class="form-group">
                    <label>स्थान / पता (Landmark / Address)</label>
                    <input type="text" id="location" placeholder="उदा: मुख्य बाज़ार रोड, कैराना" required>
                </div>

                <!-- Feature 4: Photo Upload -->
                <div class="form-group">
                    <label>समस्या की 1 फोटो अपलोड करें (Upload Photo)</label>
                    <input type="file" id="photo" accept="image/*" capture="environment" required>
                </div>

                <div class="form-group">
                    <label>विवरण (Description)</label>
                    <textarea id="description" rows="2" placeholder="समस्या का विवरण दर्ज करें..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">शिकायत दर्ज करें (Submit)</button>
            </form>
        </div>

        <!-- Complaints Tracker List -->
        <div class="card">
            <h2>हाल ही में दर्ज शिकायतें (Live Grievance Tracker)</h2>
            <div id="reportsContainer"></div>
        </div>
    </div>

    <!-- Leaflet JS for Maps -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker;
        let generatedOTP = null;
        let isPhoneVerified = false;

        // Map Setup
        window.addEventListener('load', function() {
            try {
                map = L.map('map').setView([28.6139, 77.2090], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            } catch (err) {
                console.log("Map initialization error:", err);
            }
        });

        // 📍 GPS Location Function with Fallback
        document.getElementById('getGpsBtn').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        if (map) {
                            map.setView([lat, lon], 16);
                            if (marker) map.removeLayer(marker);
                            marker = L.marker([lat, lon]).addTo(map).bindPopup("आपकी लाइव लोकेशन").openPopup();
                        }
                        alert("✅ आपकी करंट GPS लोकेशन सफलतापूर्वक सेट हो गई है!");
                    },
                    error => {
                        // If browser/device blocks GPS, set default fallback location
                        const defaultLat = 28.6139;
                        const defaultLon = 77.2090;
                        if (map) {
                            map.setView([defaultLat, defaultLon], 14);
                            if (marker) map.removeLayer(marker);
                            marker = L.marker([defaultLat, defaultLon]).addTo(map).bindPopup("डिफ़ॉल्ट लोकेशन").openPopup();
                        }
                        alert("⚠️ GPS परमिशन ब्लॉक है या लोकेशन चालू नहीं है। डिफ़ॉल्ट लोकेशन सेट कर दी गई है।");
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                alert("आपका ब्राउज़र GPS लोकेशन का समर्थन नहीं करता।");
            }
        });

        // 📲 Generate Instant OTP
        document.getElementById('sendOtpBtn').addEventListener('click', function() {
            const mobile = document.getElementById('mobile').value.trim();
            if (mobile.length !== 10 || isNaN(mobile)) {
                alert("कृपया पहले 10 अंकों का सही मोबाइल नंबर दर्ज करें!");
                return;
            }
            generatedOTP = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('otpSection').style.display = 'block';
            
            // Displays OTP directly in pop-up alert for verification
            alert(📲 [CivicFix OTP Verification]\n\nआपका 4-अंकों का OTP कोड है: ${generatedOTP}\n\nकृपया इसे 'OTP सत्यापित करें' बॉक्स में दर्ज करें।);
        });

        // ✅ Verify OTP
        document.getElementById('verifyOtpBtn').addEventListener('click', function() {
            const userOTP = document.getElementById('otpInput').value.trim();
            if (userOTP == generatedOTP && generatedOTP !== null) {
                isPhoneVerified = true;
                document.getElementById('otpMessage').innerText = "✓ मोबाइल नंबर सफलतापूर्वक वेरीफाई (Verified) हो गया है!";
                alert("✅ OTP सत्यापित हो गया!");
            } else {
                alert("❌ गलत OTP! स्क्रीन पर दिए गए सही 4-अंकों का OTP दर्ज करें।");
            }
        });

        // 📩 Submit Form Handler
        document.getElementById('issueForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!isPhoneVerified) {
                alert("⚠️ शिकायत सबमिट करने के लिए पहले मोबाइल नंबर दर्ज करके OTP वेरीफाई करें!");
                return;
            }

            const type = document.getElementById('issueType').value;
            const mobile = document.getElementById('mobile').value;
            const pincode = document.getElementById('pincode').value;
            const location = document.getElementById('location').value;
            const desc = document.getElementById('description').value;
            const photoFile = document.getElementById('photo').files[0];
            const trackId = "CF-" + Math.floor(100000 + Math.random() * 900000);

            const reader = new FileReader();
            reader.onload = function(e) {
                const imgUrl = e.target.result;
                const newReport = document.createElement('div');
                newReport.className = 'report-item';
                newReport.innerHTML = `
                    <p class="tracking-id">Tracking ID: #${trackId}</p>
                    <h3>${type} (पिन कोड: ${pincode})</h3>
                    <p><strong>मोबाइल:</strong> ${mobile} <span class="badge badge-verified">Verified</span></p>
                    <p><strong>पता:</strong> ${location}</p>
                    <p><strong>विवरण:</strong> ${desc}</p>
                    <img src="${imgUrl}" class="report-img" alt="Uploaded Issue Photo">
                    <div><span class="badge">Status: Pending Verification</span></div>
                `;
                document.getElementById('reportsContainer').prepend(newReport);

                // Reset Form
                document.getElementById('issueForm').reset();
                document.getElementById('otpSection').style.display = 'none';
                document.getElementById('otpMessage').innerText = '';
                isPhoneVerified = false;

                alert(🎉 आपकी शिकायत सफलतापूर्वक दर्ज कर ली गई है!\nआपकी Tracking ID: #${trackId});
            };
            
            if (photoFile) {
                reader.readAsDataURL(photoFile);
            }
        });
    </script>
</body>
</html>
