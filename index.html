<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicFix - Smart Grievance Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #1a252f; color: #fff; padding: 1.2rem; text-align: center; }
        .container { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
        .card h2 { color: #2c3e50; margin-bottom: 1rem; font-size: 1.2rem; border-bottom: 2px solid #ecf0f1; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        .btn-gps { background-color: #27ae60; color: white; border: none; padding: 0.8rem; border-radius: 4px; cursor: pointer; margin-bottom: 0.5rem; width: 100%; font-weight: bold; font-size: 1rem; }
        .btn-otp { background-color: #2980b9; color: white; border: none; padding: 0.8rem; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 0.4rem; width: 100%; font-size: 1rem; }
        .btn-submit { background-color: #e74c3c; color: white; border: none; padding: 0.9rem; border-radius: 4px; cursor: pointer; font-size: 1.1rem; font-weight: bold; width: 100%; margin-top: 0.5rem; }
        #map { height: 260px; width: 100%; border-radius: 6px; margin-bottom: 0.5rem; border: 2px solid #2c3e50; }
        .report-item { background: #fafafa; border-left: 5px solid #e74c3c; padding: 1rem; margin-bottom: 1rem; border-radius: 4px; }
        .report-img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 4px; margin-top: 0.5rem; }
        .badge { display: inline-block; padding: 0.3rem 0.6rem; font-size: 0.8rem; border-radius: 3px; color: white; background-color: #27ae60; margin-top: 0.5rem; }
        .otp-box { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
        .otp-box input { flex: 1; text-align: center; font-size: 1.2rem; }
        .otp-box button { width: auto; margin-top: 0; }
        .status-msg { font-weight: bold; color: #27ae60; font-size: 0.9rem; margin-top: 0.4rem; }
        .hint-text { font-size: 0.85rem; color: #666; margin-top: 0.2rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 CivicFix Smart Grievance Portal</h1>
        <p>फोटो, GPS लोकेशन, पिन कोड व OTP सत्यापन के साथ शिकायत दर्ज करें</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>नई शिकायत दर्ज करें (Report Grievance)</h2>
            
            <div class="form-group">
                <label>समस्या का प्रकार (Issue Type)</label>
                <select id="issueType">
                    <option value="Pothole">सड़क का गड्ढा (Pothole)</option>
                    <option value="Waterlogging">जलभराव (Waterlogging)</option>
                    <option value="Damaged Road">टूटी सड़क (Damaged Road)</option>
                </select>
            </div>

            <!-- Mobile Field -->
            <div class="form-group">
                <label>मोबाइल नंबर (Mobile Number)</label>
                <input type="text" id="mobile" placeholder="अपना 10 अंकों का मोबाइल नंबर दर्ज करें">
                <button type="button" class="btn-otp" onclick="sendOTPNow()">OTP प्राप्त करें (Get OTP)</button>
            </div>

            <!-- OTP Verification Section -->
            <div class="form-group" id="otpSection" style="display:none;">
                <label>OTP सत्यापित करें</label>
                <div class="otp-box">
                    <input type="text" id="otpInput" placeholder="4-अंकों का OTP लिखें" maxlength="4">
                    <button type="button" class="btn-otp" style="background-color:#27ae60;" onclick="verifyOTPNow()">Verify OTP</button>
                </div>
                <div id="otpMessage" class="status-msg"></div>
            </div>

            <!-- GPS and Map Section -->
            <div class="form-group">
                <label>आपकी करंट लोकेशन (Current Location)</label>
                <button type="button" class="btn-gps" onclick="getGPSNow()">📍 ऑटो-डिटेक्ट GPS लोकेशन सेट करें</button>
                <p class="hint-text">💡 नोट: अगर GPS काम न करे, तो सीधे नीचे मैप पर टैप/क्लिक करके लोकेशन चुनें।</p>
                <div id="map"></div>
            </div>

            <div class="form-group">
                <label>पिन कोड (Pincode)</label>
                <input type="text" id="pincode" placeholder="उदा: 247774" maxlength="6">
            </div>

            <div class="form-group">
                <label>स्थान / पता (Landmark / Address)</label>
                <input type="text" id="location" placeholder="उदा: मुख्य बाज़ार रोड, कैराना">
            </div>

            <div class="form-group">
                <label>समस्या की 1 फोटो अपलोड करें (Upload Photo)</label>
                <input type="file" id="photo" accept="image/*">
            </div>

            <div class="form-group">
                <label>विवरण (Description)</label>
                <textarea id="description" rows="2" placeholder="समस्या का विवरण दर्ज करें..."></textarea>
            </div>

            <button type="button" class="btn-submit" onclick="submitFormNow()">शिकायत दर्ज करें (Submit Complaint)</button>
        </div>

        <div class="card">
            <h2>हाल ही में दर्ज शिकायतें (Live Grievance Tracker)</h2>
            <div id="reportsContainer"></div>
        </div>
    </div>

    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map, marker;
        var myOTP = null;
        var isVerified = false;

        // Initialize Map immediately
        window.onload = function() {
            try {
                map = L.map('map').setView([28.6139, 77.2090], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                marker = L.marker([28.6139, 77.2090]).addTo(map).bindPopup("यहाँ क्लिक करके लोकेशन चुनें").openPopup();

                map.on('click', function(e) {
                    marker.setLatLng(e.latlng);
                    map.setView(e.latlng, 15);
                    marker.bindPopup("लोकेशन सेट हो गई: " + e.latlng.lat.toFixed(4) + ", " + e.latlng.lng.toFixed(4)).openPopup();
                });
            } catch(e) {
                console.log("Map Error: ", e);
            }
        };

        // GPS Function
        function getGPSNow() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(pos) {
                        var lat = pos.coords.latitude;
                        var lng = pos.coords.longitude;
                        map.setView([lat, lng], 16);
                        marker.setLatLng([lat, lng]).bindPopup("आपकी लाइव GPS लोकेशन").openPopup();
                        alert("✅ GPS लोकेशन मैप पर सेट हो गई है!");
                    },
                    function(err) {
                        alert("⚠️ GPS ऑटो-डिटेक्ट चालू नहीं हो सका। आप नीचे दिए गए मैप पर सीधा क्लिक करके लोकेशन चुन सकते हैं।");
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                alert("ब्राउज़र GPS को सपोर्ट नहीं करता। मैप पर सीधे क्लिक करें।");
            }
        }

        // Send OTP Function
        function sendOTPNow() {
            var mobileVal = document.getElementById('mobile').value;
            var cleanDigits = mobileVal.replace(/[^0-9]/g, '');

            if (cleanDigits.length < 10) {
                alert("कृपया कम से कम 10 अंकों का मोबाइल नंबर दर्ज करें!");
                return;
            }

            var finalNumber = cleanDigits.slice(-10);
            myOTP = Math.floor(1000 + Math.random() * 9000).toString();
            
            document.getElementById('otpSection').style.display = 'block';
            alert("📲 [CivicFix Alert]\n\nनंबर: " + finalNumber + "\nआपका OTP कोड है: " + myOTP + "\n\nइसे 'OTP सत्यापित करें' बॉक्स में दर्ज करें।");
        }

        // Verify OTP Function
        function verifyOTPNow() {
            var inputOTP = document.getElementById('otpInput').value.trim();
            if (inputOTP === myOTP && myOTP !== null) {
                isVerified = true;
                document.getElementById('otpMessage').innerText = "✅ मोबाइल नंबर सफलतापूर्वक सत्यापित हो गया!";
                alert("✅ OTP सत्यापित हो गया!");
            } else {
                alert("❌ गलत OTP! कृपया सही 4 अंकों का कोड दर्ज करें।");
            }
        }

        // Submit Complaint Function
        function submitFormNow() {
            if (!isVerified) {
                alert("⚠️ कृपया शिकायत दर्ज करने से पहले OTP सत्यापित करें!");
                return;
            }

            var type = document.getElementById('issueType').value;
            var mobile = document.getElementById('mobile').value;
            var pincode = document.getElementById('pincode').value;
            var location = document.getElementById('location').value;
            var desc = document.getElementById('description').value;
            var photoFile = document.getElementById('photo').files[0];

            if (!pincode || !location || !desc) {
                alert("कृपया सभी फ़ील्ड्स (पिन कोड, स्थान और विवरण) भरें!");
                return;
            }

            var trackId = 'CF-' + Math.floor(100000 + Math.random() * 900000);

            var processReport = function(imgUrl) {
                var container = document.getElementById('reportsContainer');
                var newCard = document.createElement('div');
                newCard.className = 'report-item';
                newCard.innerHTML = `
                    <h3>Tracking ID: #${trackId} - ${type}</h3>
                    <p><strong>पिन कोड:</strong> ${pincode} | <strong>मोबाइल:</strong> ${mobile} <span class="badge">Verified</span></p>
                    <p><strong>पता:</strong> ${location}</p>
                    <p><strong>विवरण:</strong> ${desc}</p>
                    ${imgUrl ? <img src="${imgUrl}" class="report-img"> : ''}
                `;
                container.prepend(newCard);

                // Reset
                document.getElementById('mobile').value = '';
                document.getElementById('pincode').value = '';
                document.getElementById('location').value = '';
                document.getElementById('description').value = '';
                document.getElementById('photo').value = '';
                document.getElementById('otpSection').style.display = 'none';
                document.getElementById('otpMessage').innerText = '';
                isVerified = false;

                alert("🎉 आपकी शिकायत दर्ज हो गई है! Tracking ID: #" + trackId);
            };

            if (photoFile) {
                var reader = new FileReader();
                reader.onload = function(e) { processReport(e.target.result); };
                reader.readAsDataURL(photoFile);
            } else {
                processReport('');
            }
        }
    </script>
</body>
</html>
