<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicFix - Pothole & Waterlogging Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #1a252f; color: #fff; padding: 1rem 2rem; text-align: center; }
        header h1 { font-size: 1.8rem; }
        header p { font-size: 0.9rem; color: #bdc3c7; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 2rem; }
        .card h2 { color: #2c3e50; margin-bottom: 1rem; font-size: 1.3rem; border-bottom: 2px solid #ecf0f1; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        .btn-submit { background-color: #e74c3c; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; transition: background 0.3s; }
        .btn-submit:hover { background-color: #c0392b; }
        .report-list { list-style: none; }
        .report-item { background: #fafafa; border-left: 4px solid #e74c3c; padding: 1rem; margin-bottom: 1rem; border-radius: 0 4px 4px 0; }
        .report-item h3 { font-size: 1.1rem; color: #333; }
        .report-item p { font-size: 0.9rem; color: #666; margin-top: 0.3rem; }
        .badge { display: inline-block; padding: 0.2rem 0.5rem; font-size: 0.8rem; border-radius: 3px; color: white; background-color: #e67e22; margin-top: 0.5rem; }
    </style>
</head>
<body>

    <header>
        <h1>🚨 CivicFix Portal</h1>
        <p>सड़क के गड्ढों और जलभराव की समस्या दर्ज करें (Civic Grievance Portal)</p>
    </header>

    <div class="container">
        <!-- Complaint Form -->
        <div class="card">
            <h2>नई शिकायत दर्ज करें (Report Issue)</h2>
            <form id="issueForm">
                <div class="form-group">
                    <label for="issueType">समस्या का प्रकार (Issue Type)</label>
                    <select id="issueType" required>
                        <option value="Pothole">सड़क का गड्ढा (Potholes)</option>
                        <option value="Waterlogging">जलभराव (Waterlogging)</option>
                        <option value="Damaged Road">टूटी सड़क (Damaged Road)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="location">स्थान / लैंडमार्क (Location)</label>
                    <input type="text" id="location" placeholder="जैसे: मुख्य बाज़ार रोड, कैराना" required>
                </div>
                <div class="form-group">
                    <label for="description">विवरण (Description)</label>
                    <textarea id="description" rows="3" placeholder="समस्या के बारे में थोड़ी जानकारी दें..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">शिकायत सबमिट करें</button>
            </form>
        </div>

        <!-- Recent Complaints List -->
        <div class="card">
            <h2>हाल ही में दर्ज की गई शिकायतें (Recent Reports)</h2>
            <div id="reportsContainer">
                <div class="report-item">
                    <h3>सड़क का गड्ढा (Potholes)</h3>
                    <p><strong>स्थान:</strong> मेन चौराहा, पास पुलिस चौकी</p>
                    <p>बड़ा गड्ढा है जिससे हादसों का खतरा बना रहता है।</p>
                    <span class="badge">Pending Action</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('issueForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const type = document.getElementById('issueType').value;
            const location = document.getElementById('location').value;
            const desc = document.getElementById('description').value;

            const newReport = document.createElement('div');
            newReport.className = 'report-item';
            newReport.innerHTML = `
                <h3>${type}</h3>
                <p><strong>स्थान:</strong> ${location}</p>
                <p>${desc}</p>
                <span class="badge">Submitted</span>
            `;

            document.getElementById('reportsContainer').prepend(newReport);
            document.getElementById('issueForm').reset();
            alert('आपकी शिकायत सफलतापूर्वक दर्ज कर ली गई है!');
        });
    </script>
</body>
</html>
